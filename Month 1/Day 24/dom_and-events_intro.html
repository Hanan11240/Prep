<!-- The Document Object Model (DOM) is a programming interface for web documents. It represents the page so that programs can change the document structure, style, and content. The DOM represents the document as nodes and objects; that way, programming languages can interact with the page. -->

<!-- The DOM (Document Object Model) is not a JavaScript object itself, but it is an interface provided by the browser that JavaScript can interact with to manipulate web pages. -->

<!-- What is the DOM? -->
<!-- DOM is a tree-like structure that represents the HTML document. -->
<!-- Each HTML element (like <div>, <p>, <a>, etc.) is a node in this tree. -->
<!-- The browser creates this structure when it loads the web page. -->

<!-- JavaScript can use the DOM API to: -->
<!-- Read elements (document.getElementById())

Modify content (element.textContent = "hello")

Change styles, handle events, etc. -->





<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .child {
            border: 1px solid red;
            padding: 2px 2px;
        }

<body>
    <div>

        <!-- Example 1 -->

        <!-- Example 3 -->
        <div style="border: 1px solid black; height: 50px;
        width: 100px;" id="parent">Parent</div>

        <button id="add-child">Add Child</button>
        <button id="remove-child">Remove Child</button>
    </div>
    <script>
        // Example 1
        // const search = document.getElementById('story');

        // const setText = document.getElementById('set-text')
        // const clearText = document.getElementById('clear-text')

        // setText.addEventListener('click', () => {

        // })

        // Example 2
        // window.onload = () => {
        //     const heading = document.createElement('h1');
        //     // const headingText = document.createTextNode("Big Head!");
        //     // heading.appendChild(headingText);
        //     //or
        //     heading.textContent = "Big Head!";
        //     document.body.appendChild(heading);
        // }

        const parentEl = document.getElementById('parent');
        const btn = document.getElementById('add-child');
        const rbtn = document.getElementById('remove-child');

        btn.addEventListener('click', () => {
            if (childExists()) {
                return
            }
            const child = document.createElement('div');
            child.classList.add('child')
            child.textContent = 'Child'
            parentEl.appendChild(child)
        });

        rbtn.addEventListener('click', () => {
            const child = document.getElementsByClassName('child')[0];
            parentEl.removeChild(child)
        });

        function childExists() {

            // return parentEl.childNodes.length > 1
            return parentEl.children.length > 0
        }

    </script>
</body>

</html>
